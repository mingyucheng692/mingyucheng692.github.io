# 标签白名单（Tag Vocabulary）
# 所有文章 frontmatter 中的 tags 必须在此注册，否则构建失败。
# 新增标签：先在此登记，再在文章中使用。
# 规则：技术标签用官方/惯用拼写（Go 而非 Golang，Qt 而非 Qt6），
#       版本细节写入正文；微观排障词下沉至全文搜索。

# --- 1. 核心技术栈与工程底座（职业方向：Linux C++ · EMS Storage · Protocol Gateway）---
Linux: 核心底座 — 嵌入式开发板/工控机/内核与系统调用
C++: 核心方向 — 现代 C++ 语言与工业级工程实践
Qt: 工业桌面与 HMI 应用（Qt Core / GUI / 跨平台）
Go: 云边协同与边缘网关高性能后端语言

# --- 2. 工业总线与通信协议 ---
Modbus: EMS 储能与工业现场总线协议（RTU / TCP）
MQTT: 物联网边缘数据汇聚与云端通信协议
"RS-232": 工业串口电气标准与硬件接口排障
"RS-485": 工业差分总线物理层标准（预留）

# --- 3. 嵌入式 Linux 与网关运行时 ---
Systemd: Linux 守护进程生命周期与看门狗自愈机制
Podman: 边缘轻量级无根（Rootless）容器引擎
Docker: 跨平台容器引擎与环境编排
Nginx: 边缘网关反向代理与 TLS/流量调度
Redis: 工业边缘缓存与状态会话管理
Windows: 工控机与跨平台开发环境

# --- 4. 系统级攻坚与工程质量 ---
Multithreading: 多线程并发调度与死锁排障
Performance: 性能分析与低延迟调优
Networking: 边缘网络架构、源 IP 保持与路由
Security: 工业物联网安全、凭证鉴权与防御
"CI/CD": 跨架构持续集成、交叉编译与发布流程
